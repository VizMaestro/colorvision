<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LearnLab</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#222;background:#fff}
main{max-width:760px;margin:24px auto;padding:0 16px}
pre{background:#272822;color:#f8f8f2;padding:12px;border-radius:8px;font-size:14px}
.k{color:#f92672}.s{color:#a6e22e}.n{color:#ae81ff}.c{color:#75715e}
.q{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}
.right{border-color:#2e7d32;background:#e8f5e9}.wrong{border-color:#c62828;background:#ffebee}
</style></head><body><main>
<h1>Lesson 4: Variables</h1>
<pre><span class="k">const</span> name = <span class="s">"Ada"</span>; <span class="c">// string</span>
<span class="k">let</span> count = <span class="n">42</span>;</pre>
<div class="q right" data-probe data-expect="#e8f5e9">Correct: a variable stores a value.</div>
<div class="q wrong" data-probe data-expect="#ffebee">Incorrect: variables never change.</div>
<svg width="320" height="120" role="img" aria-label="Diagram">
<rect x="10" y="20" width="90" height="80" fill="#d62728" data-probe data-expect="#d62728"/>
<rect x="115" y="20" width="90" height="80" fill="#2ca02c" data-probe data-expect="#2ca02c"/>
<rect x="220" y="20" width="90" height="80" fill="#1f77b4" data-probe data-expect="#1f77b4"/></svg>
</main></body></html>
