<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Charts</title>
<style>body{margin:20px;font:14px system-ui,sans-serif}.legend span{display:inline-block;width:14px;height:14px;margin:0 4px 0 12px;vertical-align:middle}</style></head><body>
<h2>Quarterly performance</h2>
<div class="legend"><span style="background:#d62728" data-probe data-expect="#d62728"></span>Loss<span style="background:#2ca02c" data-probe data-expect="#2ca02c"></span>Gain<span style="background:#ff7f0e" data-probe data-expect="#ff7f0e"></span>Flat</div>
<svg width="460" height="200" role="img" aria-label="Bars">
<rect x="20" y="60" width="60" height="130" fill="#d62728" data-probe data-expect="#d62728"/>
<rect x="100" y="30" width="60" height="160" fill="#2ca02c" data-probe data-expect="#2ca02c"/>
<rect x="180" y="90" width="60" height="100" fill="#ff7f0e" data-probe data-expect="#ff7f0e"/>
<rect x="260" y="50" width="60" height="140" fill="#8c564b" data-probe data-expect="#8c564b"/>
<rect x="340" y="70" width="60" height="120" fill="#9467bd" data-probe data-expect="#9467bd"/></svg>
<canvas id="c" width="460" height="200" data-points="80:100,220:100,360:100" style="display:block;margin-top:10px"></canvas>
<script>
const c=document.getElementById('c').getContext('2d');
c.fillStyle='#fff';c.fillRect(0,0,460,200);
c.fillStyle='#e41a1c';c.fillRect(20,40,120,120);
c.fillStyle='#4daf4a';c.fillRect(160,40,120,120);
c.fillStyle='#377eb8';c.fillRect(300,40,120,120);

</script>
</body></html>
